server:
  port: ${AI_SERVICE_PORT:8085}
  servlet:
    context-path: /ai

spring:
  config:
    import: optional:file:../.env[.properties]
  devtools:
    livereload:
      enabled: false
  application:
    name: ai_engine_service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.springframework.ai.model.azure.openai.autoconfigure.AzureOpenAiChatAutoConfiguration
      - org.springframework.ai.model.azure.openai.autoconfigure.AzureOpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.azure.openai.autoconfigure.AzureOpenAiImageAutoConfiguration
      - org.springframework.ai.model.azure.openai.autoconfigure.AzureOpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  data:
    mongodb:
      host: ${MONGO_DB_HOST:localhost}
      port: ${MONGO_DB_PORT:27017}
      username: ${MONGO_DB_USERNAME:admin}
      password: ${MONGO_DB_PASSWORD:password}
      database: ${AI_MONGO_DB_NAME:ai_engine_db}
      authentication-database: admin
  main:
    banner-mode: "off"
    log-startup-info: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD:admin123}

app:
  security:
    credential-key: ${APP_ENCRYPTION_KEY:}
  gateway:
    internal-secret: ${GATEWAY_INTERNAL_SECRET:changeme}
  user-service:
    base-url: ${USER_SERVICE_URL:http://localhost:8081/user}
  job-service:
    base-url: ${JOB_SERVICE_URL:http://localhost:8082/job}
  application-service:
    base-url: ${APPLICATION_SERVICE_URL:http://localhost:8083/application}
  ai:
    recommend-batch-size: ${AI_RECOMMEND_BATCH:20}
  onet:
    enabled: ${ONET_ENABLED:false}
    base-url: ${ONET_BASE_URL:https://api-v2.onetcenter.org}
    api-key: ${ONET_API_KEY:}
    search-limit: ${ONET_SEARCH_LIMIT:5}

logging:
  level:
    root: WARN
    org.springframework: WARN
    org.springframework.boot: WARN
    org.springframework.data: WARN
    org.mongodb.driver: WARN
    org.hibernate: WARN
    "vn.chuongpl.ai_engine_service": INFO
    "org.springframework.ai": INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %msg%n"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
